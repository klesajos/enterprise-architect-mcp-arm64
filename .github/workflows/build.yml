name: Build against latest Sparx MSI

# Verifies the repackaging tooling still produces a valid native ARM64 MSI from the
# CURRENT official Sparx installer (the download URL is unversioned = always latest).
# This catches breakage when Sparx ships a new version.
#
# NOTE: the runner is x64 Windows, so this BUILDS the ARM64 MSI (cross-target) and
# validates it; it cannot install/run it (that needs real ARM64 hardware). No MSI is
# uploaded anywhere - it contains Sparx's proprietary binaries, which are never redistributed.

on:
  schedule:
    - cron: '0 6 * * 1'        # every Monday 06:00 UTC
  workflow_dispatch:            # manual run button
  push:
    branches: [ main ]
    paths:                      # re-test the tooling itself when it changes
      - 'build.ps1'
      - 'src/**'
      - 'apphost/**'
      - '.config/**'
      - '.github/workflows/build.yml'

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        source: [x64, x86]      # both official installers share the managed payload
    name: build from ${{ matrix.source }} MSI
    steps:
      - uses: actions/checkout@v6

      - name: Set up .NET 9 SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '9.0.x'

      - name: Download latest official Sparx MSI (${{ matrix.source }})
        shell: pwsh
        run: |
          $url = 'https://www.sparxsystems.jp/en/MCP/bin/MCP_EA_${{ matrix.source }}.msi'
          $dst = Join-Path $env:RUNNER_TEMP 'MCP_EA_source.msi'
          Write-Host "Downloading $url"
          Invoke-WebRequest -Uri $url -OutFile $dst -MaximumRedirection 5 `
            -Headers @{ 'User-Agent' = 'enterprise-architect-mcp-arm64-ci' }
          $len = (Get-Item $dst).Length
          Write-Host "Downloaded $len bytes"
          if ($len -lt 500000) { throw "Download looks too small ($len bytes) - URL changed or blocked?" }
          # A large soft-200 page (CDN block page) passes the size check but is not an MSI;
          # catch it here instead of as a confusing msiexec error inside build.ps1.
          $fs = [System.IO.File]::OpenRead($dst)
          try { $magic = New-Object byte[] 8; $null = $fs.Read($magic, 0, 8) } finally { $fs.Dispose() }
          $magicHex = -join ($magic | ForEach-Object ToString X2)
          if ($magicHex -ne 'D0CF11E0A1B11AE1') { throw "Downloaded file is not an MSI (bad OLE signature: $magicHex) - URL changed or blocked?" }
          # Gate BEFORE the file is handed to the build (msiexec /a executes admin-sequence
          # custom actions): the weekly run consumes this URL unattended, so a compromised
          # download must fail here. build.ps1 re-checks the signature as defense-in-depth.
          $sig = Get-AuthenticodeSignature $dst
          if ($sig.Status -ne 'Valid') { throw "Authenticode check failed: status $($sig.Status), expected Valid" }
          if ($sig.SignerCertificate.Subject -notmatch 'Sparx Systems') { throw "Unexpected signer: $($sig.SignerCertificate.Subject)" }
          # Record what was consumed, so an unexpected rotation is auditable after the fact
          $hash = (Get-FileHash $dst -Algorithm SHA256).Hash
          Write-Host "::notice::Source ${{ matrix.source }} MSI SHA-256 $hash, signed by $($sig.SignerCertificate.Subject)"
          "### Source ${{ matrix.source }} MSI`n- SHA-256: ``$hash```n- Signer: $($sig.SignerCertificate.Subject)" | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          "MSI_PATH=$dst" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build native ARM64 MSI
        shell: pwsh
        run: ./build.ps1 -SourceMsi "$env:MSI_PATH"

      - name: Verify the output is a valid Arm64 MSI
        shell: pwsh
        run: |
          $msi = 'dist/MCP_EA_arm64.msi'
          if (-not (Test-Path $msi)) { throw 'ARM64 MSI was not produced' }
          $full = (Resolve-Path $msi).Path
          $inst = New-Object -ComObject WindowsInstaller.Installer
          $si = $inst.GetType().InvokeMember('SummaryInformation','GetProperty',$null,$inst,@($full,0))
          $tpl = [string]$si.GetType().InvokeMember('Property','GetProperty',$null,$si,@([int]7))
          $len = (Get-Item $full).Length
          Write-Host "Produced $msi ($len bytes) - Template: $tpl"
          if ($tpl -notmatch 'Arm64') { throw "Expected an Arm64 template, got '$tpl'" }
          Write-Host "::notice::OK - built a valid Arm64 MSI from the ${{ matrix.source }} source ($len bytes, Template $tpl)"

  notify-failure:
    # A failed scheduled run otherwise notifies effectively nobody (emails depend on the
    # cron author's personal notification settings) - for a job whose whole purpose is
    # early warning that Sparx shipped a breaking installer, file an issue instead.
    # A downstream job (not a step) so the 2-leg matrix files at most ONE issue per run,
    # and issues:write stays scoped here rather than on the build job.
    needs: build
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          title="Weekly Sparx MSI build failed"
          body="Scheduled run failed: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID} - Sparx may have shipped a breaking installer."
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$title\" in:title" --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body"
          fi

  keepalive:
    # GitHub auto-disables 'schedule' triggers in public repos after 60 days without
    # repository activity (workflow runs do not count), which would silently kill this
    # canary on a feature-complete repo. Re-enabling the workflow via the API is a no-op
    # that still resets that timer, so every run pushes the window forward.
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/build.yml/enable"
